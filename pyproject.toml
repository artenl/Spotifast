[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotifast"
version = "1.0.0"
description = "Private, login-protected web front end for the Sunnify CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
spotifast-admin = "spotifast.cli:main"

[tool.setuptools]
packages = ["spotifast"]

[tool.setuptools.package-data]
spotifast = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
