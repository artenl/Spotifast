<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Spotifast{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  <script src="/static/common.js?v={{ asset_v }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="grain" aria-hidden="true"></div>
  {% if user %}
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Spotifast, accueil">Spoti<em>fast</em></a>
    <nav class="topnav">
      <a href="/account" class="who" title="Mon compte"><span class="dot" aria-hidden="true"></span><span class="who-name">{{ user.username }}</span></a>
      {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="linklike">Déconnexion</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">
    <span>Moteur : <a href="https://github.com/sunnypatell/sunnify-spotify-downloader" target="_blank" rel="noopener noreferrer">Sunnify</a> de Sunny Patel, utilisé sans modification.</span>
    <span>Spotifast {{ version }} · cercle privé</span>
  </footer>
</body>
</html>
